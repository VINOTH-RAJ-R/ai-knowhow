name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry, skills, manifests and routing table
        run: python3 tools/validate.py
      - name: Router behavior tests
        run: python3 tools/test_route.py
      - name: Release checks (directory rules, versions, secrets, placeholders)
        run: python3 tools/release.py --check
      - name: Build upload ZIPs (smoke test)
        run: python3 tools/install.py zip --dest /tmp/dist && unzip -l /tmp/dist/modelwise.zip | head -5
