name: release

# Push a tag like v0.2.0 to publish a GitHub Release with every upload ZIP attached:
# claude.ai/Cowork plugin ZIPs, single-skill ZIPs (claude.ai, ChatGPT), and OpenAI plugin-directory ZIPs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in plugins/*/.claude-plugin/plugin.json plugins/*/.codex-plugin/plugin.json; do
            V=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$f")
            [ "$V" = "$TAG" ] || { echo "$f has version $V, tag is $TAG"; exit 1; }
          done
      - name: Release checks and ZIPs
        run: python3 tools/release.py --check --build
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "ai-knowhow $GITHUB_REF_NAME" \
            --notes "Install in Claude Code: /plugin marketplace add ${GITHUB_REPOSITORY} then /plugin install modelwise@ai-knowhow and /plugin install retrace@ai-knowhow. ZIPs below are for claude.ai/Cowork (Customize → Plugins → Upload plugin), ChatGPT skills, and the OpenAI plugin directory."
